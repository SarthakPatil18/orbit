<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"question","type":"string","label":"Question","default":"How do I export only paid attendees?"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f4f2ec;
        --ink: #111411;
        --font-display: "EB Garamond", "Times New Roman", serif;
        --font-sans: Inter, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="question"
        data-composition-id="question"
        data-composition-src="compositions/question.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="answer"
        data-composition-id="answer"
        data-composition-src="compositions/answer.html"
        data-start="5"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="close"
        data-composition-id="close"
        data-composition-src="compositions/close.html"
        data-start="10"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
