services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proofdesk
      POSTGRES_PASSWORD: proofdesk
      POSTGRES_DB: proofdesk
    ports:
      - "5432:5432"
    volumes:
      - proofdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofdesk -d proofdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proofdesk_pg: